services:
  - type: web
    name: neuralift-backend
    runtime: node
    plan: free
    branch: master
    # Blueprint runs from repo root; backend lives in ./backend
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Render injects PORT automatically — do NOT hardcode it
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      # Allowed frontend origins on Vercel, comma-separated.
      - key: CLIENT_ORIGIN
        value: https://neura-lift.vercel.app
      # Single canonical frontend origin for redirects and email links.
      - key: CLIENT_URL
        value: https://neura-lift.vercel.app
      # Backend origin without /api, used in resend-verification links.
      - key: API_URL
        value: https://neuralift-deploy-app.onrender.com
      # Optional: add GROQ_API_KEY, OPENAI_API_KEY, or OPENROUTER_API_KEY
      # in the Render dashboard to enable the corresponding AI provider.
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      # Optional Google login: add GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
      # and GOOGLE_CALLBACK_URL in the dashboard. Callback must match Google Console.
      # Resend uses HTTPS, so email works on Render Free.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CONTACT_EMAIL
        sync: false
